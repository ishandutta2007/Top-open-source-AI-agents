<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0a16"/><stop offset="50%" stop-color="#111129"/><stop offset="100%" stop-color="#070711"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".2"/></linearGradient><radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".45"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient><radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".35"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient><radialGradient id="orbGlow3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="slightGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes pulseGlow2{0%{opacity:.25;transform:scale(1.05)}50%{opacity:.55;transform:scale(.95)}}@keyframes dashMove{0%{stroke-dashoffset:200}}@keyframes nodeBlink{0%{opacity:.3;r:3}50%{opacity:1;r:5}}@keyframes scanline{0%{transform:translateY(-100px);opacity:0}50%{opacity:.15}}@keyframes badgeShimmer{0%{filter:drop-shadow(0 0 4px rgba(99,102,241,.4))}50%{filter:drop-shadow(0 0 12px rgba(236,72,153,.7))}}.floating{animation:floatSlow 6s ease-in-out infinite;transform-origin:center}.pulsing-1{animation:pulseGlow 7s ease-in-out infinite alternate;transform-origin:200px 100px}.pulsing-2{animation:pulseGlow2 8s ease-in-out infinite alternate;transform-origin:1000px 220px}.circuit-line{stroke-dasharray:8 6;animation:dashMove 15s linear infinite}.circuit-line-fast{stroke-dasharray:6 4;animation:dashMove 9s linear infinite reverse}.node-1{animation:nodeBlink 3s ease-in-out infinite}.node-2{animation:nodeBlink 2.5s ease-in-out .8s infinite}.node-3{animation:nodeBlink 3.2s ease-in-out 1.5s infinite}.shimmer-badge{animation:badgeShimmer 4s ease-in-out infinite}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-1px}.subtitle-text{font-weight:400;letter-spacing:.5px}.tag-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:600;letter-spacing:.8px}</style></defs><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><rect width="1198" height="318" x="1" y="1" fill="none" stroke="url(#accentGrad)" stroke-opacity=".35" stroke-width="1.5" rx="15"/><ellipse cx="200" cy="100" fill="url(#orbGlow1)" class="pulsing-1" rx="260" ry="180"/><ellipse cx="1020" cy="220" fill="url(#orbGlow2)" class="pulsing-2" rx="280" ry="200"/><circle cx="600" cy="160" r="190" fill="url(#orbGlow3)" opacity=".18"/><g stroke="#6366f1" stroke-width=".75" opacity=".18"><line x1="100" x2="100" y1="0" y2="320" stroke-dasharray="3 6"/><line x1="300" x2="300" y1="0" y2="320" stroke-dasharray="3 6"/><line x1="600" x2="600" y1="0" y2="320" stroke-dasharray="3 6"/><line x1="900" x2="9